{% extends 'base.html' %}

{% block content %}
{% for post in blog %}
<div class="card">
  <img src="{{post.image.url}}" class="card-img-top" alt="...">
  <div class="card-body">
    <ul class="post-meta" style="list-style-type: none; padding-left: 0px;">
      <li><i class="fa fa-tag"></i><a>{{post.category}}</a></li>
      <li><i class="fa fa-comment"></i><a>{{ post.comments.all.count }} Comments</a></li>
      <li><i class="fa fa-user"></i><a>Post By {{post.Author}}</a></li>
      <li><i class="fa fa-clock-o"></i><a>{{post.date | date:'d F'}}</a></li>
    </ul>
    <a style="text-decoration:none; color:black" href="{% url 'blogapp:blog-detail' post.pid %}"><h5 class="card-title">{{post.title}}</h5></a>
    <p class="card-text">{{post.content | slice:':250' | safe}}...</p>
    <a href="{% url 'blogapp:blog-detail' post.pid %}"><button type="button" class="btn btn-lg btn-dark">Read More</button></a>
  </div>
</div>
{% endfor %}
{% endblock %}
